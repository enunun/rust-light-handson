[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# 所有権とライフタイムを可視化するRustOwl．VS Codeの拡張機能cordx56.rustowl-vscodeから使う．
"github:cordx56/rustowl" = "0.4.0"
# 版を固定する場合はここで`mise lock`を実行し，生成されたmise.lockもコミットする．

# 実際に利用する場合には以下を有効にする
# [settings]
# lockfile = true

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.fmt]
description = "Rustのコードを整形する"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Rustのコードが整形済みか確かめる"
run = "cargo fmt --all --check"

[tasks."lint:rust"]
description = "模範解答にclippyを実行する"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:docs"]
description = "文書のリント，Mermaidの構文検査，図と実装の照合を実行する"
depends = ["install"]
run = "pnpm lint"

[tasks.lint]
description = "すべてのリントを実行する"
depends = ["lint:rust", "lint:docs"]

[tasks.test]
description = "模範解答と演習のテストを実行する"
run = ["cargo test --workspace", "bash scripts/test-exercises.sh"]

[tasks.rustowl]
description = "RustOwlで，関数の中の変数の所有権と借用を端末に表示する(パッケージの中で実行する．例: mise run rustowl -- object::hash_blob data)"
dir = "{{cwd}}"
run = "rustowl show"

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフックなど)"
depends = ["install", "hooks"]

[tasks.check]
description = "整形の検査，リント，テストをまとめて実行する(CIと同じ)"
depends = ["fmt:check", "lint", "test"]
